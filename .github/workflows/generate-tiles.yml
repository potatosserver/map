name: Build KMU PMTiles (Centerline Merged)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.pmtiles'
      - 'README.md'
      - '**.html'
  workflow_dispatch:
    inputs:
      bounds:
        description: 'BBOX 範圍 (minLon,minLat,maxLon,maxLat)'
        required: true
        default: '120.300,22.640,120.320,22.660'

jobs:
  generate-pmtiles:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 允許 Actions 將產出的 PMTiles Commit 推回儲存庫

    steps:
      - name: 檢出儲存庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Java 21 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 下載全台灣最新 OSM PBF 圖資 (Geofabrik)
        run: |
          wget -q https://download.geofabrik.de/asia/taiwan-latest.osm.pbf -O taiwan.osm.pbf

      - name: 下載 Planetiler 最新版建置工具
        run: |
          wget -q https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar -O planetiler.jar

      - name: 執行 Planetiler（自動下載地貌 + 計算合併道路中心線）
        run: |
          # 取得經緯度範圍 (預設為高醫周邊)
          BOUNDS="${{ github.event.inputs.bounds || '120.300,22.640,120.320,22.660' }}"
          
          # --download：自動下載缺失的湖泊/海洋輔助資料
          # --transportation_name_limit_merge=true：強烈進行雙向道路名稱與幾何的聚合
          java -Xmx3g -jar planetiler.jar \
            --osm-path=taiwan.osm.pbf \
            --output=kmu.pmtiles \
            --download \
            --bounds=$BOUNDS \
            --transportation_name_limit_merge=true \
            --force

      - name: 將生成的 PMTiles 圖磚推送回儲存庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add kmu.pmtiles
          
          if git diff --staged --quiet; then
            echo "圖磚資料無變化，跳過 Commit"
          else
            git commit -m "chore: 自動更新並計算高醫周邊中心線 PMTiles 圖磚 [skip ci]"
            git push
          fi
